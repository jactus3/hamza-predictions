name: Update Predictions

on:
  schedule:
    - cron: "0 */12 * * *" # كل 12 ساعة (00:00 و 12:00 بتوقيت UTC تقريبًا)
  workflow_dispatch: {} # يسمح بتشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collection + analysis agent
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node agent/collect.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "hamza-predictions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json agent/cache.json
          git diff --cached --quiet || git commit -m "chore: تحديث تلقائي للتوقعات"
          git push
