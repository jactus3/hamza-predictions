<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza Predictions</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F19;
    --bg-2:#0F1526;
    --green:#10B981;
    --green-bright:#00E676;
    --amber:#F59E0B;
    --card-border:rgba(255,255,255,0.08);
    --card-bg:rgba(255,255,255,0.035);
  }

  *{box-sizing:border-box;}

  html,body{
    background:var(--bg);
    color:#E5E7EB;
    font-family:'Cairo', sans-serif;
    margin:0;
    min-height:100%;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(16,185,129,0.10) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(0,230,118,0.06) 0%, transparent 40%);
    background-attachment:fixed;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .glass{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .tab-btn{
    transition:all .25s ease;
  }
  .tab-btn.active{
    background:linear-gradient(135deg, var(--green), var(--green-bright));
    color:#04140D;
    box-shadow:0 0 24px rgba(16,185,129,0.35);
  }
  .tab-btn:not(.active){
    color:#9CA3AF;
  }
  .tab-btn:not(.active):hover{
    color:#E5E7EB;
    background:rgba(255,255,255,0.05);
  }

  .day-chip{
    transition:all .2s ease;
    white-space:nowrap;
  }
  .day-chip.active{
    background:rgba(16,185,129,0.18);
    border-color:var(--green);
    color:var(--green-bright);
  }
  .day-chip:not(.active):hover{
    border-color:rgba(255,255,255,0.25);
  }

  .match-card{
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    cursor:pointer;
  }
  .match-card:hover{
    transform:translateY(-3px);
    border-color:rgba(16,185,129,0.4);
    box-shadow:0 10px 30px -10px rgba(16,185,129,0.25);
  }

  .meter-track{
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    overflow:hidden;
    height:8px;
  }
  .meter-fill{
    height:100%;
    border-radius:999px;
    width:0%;
    transition:width 1s cubic-bezier(.22,1,.36,1);
  }

  .badge-high{ background:rgba(0,230,118,0.15); color:var(--green-bright); border:1px solid rgba(0,230,118,0.35); }
  .badge-mid{ background:rgba(16,185,129,0.14); color:#34D399; border:1px solid rgba(16,185,129,0.3); }
  .badge-low{ background:rgba(245,158,11,0.14); color:var(--amber); border:1px solid rgba(245,158,11,0.3); }

  .fill-high{ background:linear-gradient(90deg, #10B981, #00E676); }
  .fill-mid{ background:linear-gradient(90deg, #059669, #10B981); }
  .fill-low{ background:linear-gradient(90deg, #B45309, #F59E0B); }

  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--green-bright);
    box-shadow:0 0 0 0 rgba(0,230,118,0.6);
    animation:pulseDot 2s infinite;
  }
  @keyframes pulseDot{
    0%{ box-shadow:0 0 0 0 rgba(0,230,118,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(0,230,118,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,230,118,0); }
  }

  #modalOverlay{
    background:rgba(4,8,15,0.75);
    backdrop-filter:blur(6px);
  }

  #modalPanel{
    animation:modalIn .3s ease-out;
  }
  @keyframes modalIn{
    from{ opacity:0; transform:translateY(16px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:999px; }

  ::selection{ background:var(--green); color:#04140D; }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--green-bright);
    outline-offset:2px;
  }
</style>
</head>
<body>

  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-white/5 bg-[#0B0F19]/85 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-lg"
             style="background:linear-gradient(135deg, var(--green), var(--green-bright)); color:#04140D;">
          HP
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold text-white leading-tight">Hamza Predictions</h1>
          <p id="dataSourceNote" class="text-[11px] sm:text-xs text-gray-400 leading-tight">تحليلات ذكية وتوقعات نسب الفوز</p>
        </div>
      </div>
      <div class="glass rounded-full px-3 py-1.5 flex items-center gap-2 text-xs sm:text-sm text-gray-300">
        <span class="live-dot"></span>
        <span id="liveDate" class="font-medium"></span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-16">

    <!-- Tabs -->
    <div class="glass rounded-2xl p-1.5 flex gap-1.5 mb-6">
      <button id="tabToday" class="tab-btn active flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base">
        مباريات اليوم
      </button>
      <button id="tabWeek" class="tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm sm:text-base">
        جدول الأسبوع
      </button>
    </div>

    <!-- Day chips (weekly view only) -->
    <div id="dayChips" class="hidden -mx-4 px-4 sm:mx-0 sm:px-0 overflow-x-auto mb-6">
      <div class="flex gap-2 w-max sm:w-full sm:flex-wrap">
        <!-- injected -->
      </div>
    </div>

    <!-- Section title -->
    <div class="flex items-center justify-between mb-4">
      <h2 id="sectionTitle" class="text-white font-bold text-base sm:text-lg">أفضل التوقعات لهذا اليوم</h2>
      <span id="matchCount" class="text-xs sm:text-sm text-gray-500"></span>
    </div>

    <!-- Matches list -->
    <div id="matchesList" class="grid gap-4 sm:gap-5"></div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden glass rounded-2xl p-10 text-center text-gray-400">
      لا توجد مباريات مسجّلة في هذا اليوم.
    </div>

    <!-- Share -->
    <div class="mt-8 flex justify-center">
      <button id="shareBtn"
        class="flex items-center gap-2 px-5 py-3 rounded-full font-bold text-sm sm:text-base text-[#04140D]"
        style="background:linear-gradient(135deg, var(--green), var(--green-bright)); box-shadow:0 8px 24px -8px rgba(16,185,129,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2zm0 18.18h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.21-8.24 8.21zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.48-1.39-1.73-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.36-.77-1.86-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.06 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.68 4.25 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.28z"/></svg>
        مشاركة عبر واتساب
      </button>
    </div>

    <p class="text-center text-[11px] text-gray-600 mt-6">
      بيانات تجريبية للعرض التوضيحي — وليست نتائج مباشرة أو توقعات حقيقية.
    </p>

  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="modalPanel" class="glass rounded-2xl w-full max-w-md max-h-[85vh] overflow-y-auto p-6 relative" style="background:#0F1526ee;">
      <button id="modalClose" class="absolute top-4 left-4 text-gray-400 hover:text-white text-xl leading-none">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
(function(){

  // ---------- Live date badge ----------
  var dateEl = document.getElementById('liveDate');
  var todayDate = new Date();
  var dateFmt = new Intl.DateTimeFormat('ar-SA-u-nu-latn', { weekday:'long', day:'numeric', month:'long' });
  dateEl.textContent = dateFmt.format(todayDate);

  // ---------- Data ----------
  var DAYS = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
  // Map JS getDay() (0=Sun..6=Sat) to our Arabic week order index
  var jsDayToArabic = [1,2,3,4,5,6,0]; // Sun->1, Mon->2 ... Sat->0
  var todayIndex = jsDayToArabic[todayDate.getDay()];
  var todayName = DAYS[todayIndex];

  // بيانات احتياطية تُستخدم فقط إذا تعذّر الوصول إلى data/matches.json
  // (كما يحدث داخل معاينة Claude، التي لا تصل لملفات خارج الصفحة نفسها).
  // بعد النشر على Vercel/Netjson ومع تفعيل الوكيل، تُستبدل هذه تلقائيًا ببيانات حقيقية محدَّثة كل 12 ساعة.
  var SAMPLE_MATCHES = [
    { teamA:'ريال مدريد', teamB:'خيتافي', venue:'home', league:'الدوري الإسباني', country:'إسبانيا', day:todayName, time:'21:00', prob:86,
      analysis:{
        form:'ريال مدريد فاز في 4 من آخر 5 مباريات، مقابل انتصارين فقط لخيتافي.',
        side:'ريال مدريد يحقق معدل 2.6 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +28 لريال مدريد، مقابل -3 لخيتافي.' } },

    { teamA:'مانشستر سيتي', teamB:'إيفرتون', venue:'home', league:'الدوري الإنجليزي', country:'إنجلترا', day:todayName, time:'19:30', prob:79,
      analysis:{
        form:'مانشستر سيتي فاز في 3 من آخر 5 مباريات، مقابل فوز واحد لإيفرتون.',
        side:'مانشستر سيتي يحقق معدل 2.3 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +19 لمانشستر سيتي، مقابل -8 لإيفرتون.' } },

    { teamA:'الهلال', teamB:'الاتحاد', venue:'home', league:'دوري روشن السعودي', country:'السعودية', day:todayName, time:'20:00', prob:64,
      analysis:{
        form:'الهلال فاز في 3 من آخر 5 مباريات، مقابل فوزين للاتحاد.',
        side:'الهلال يحقق معدل 2.1 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +14 للهلال، مقابل +6 للاتحاد.' } },

    { teamA:'بايرن ميونخ', teamB:'فرايبورج', venue:'home', league:'الدوري الألماني', country:'ألمانيا', day: DAYS[(todayIndex+1)%7], time:'17:30', prob:91,
      analysis:{
        form:'بايرن ميونخ فاز في 5 من آخر 5 مباريات، مقابل فوزين لفرايبورج.',
        side:'بايرن ميونخ يحقق معدل 2.8 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +35 لبايرن ميونخ، مقابل +2 لفرايبورج.' } },

    { teamA:'إنتر ميلان', teamB:'أودينيزي', venue:'home', league:'الدوري الإيطالي', country:'إيطاليا', day: DAYS[(todayIndex+1)%7], time:'22:45', prob:72,
      analysis:{
        form:'إنتر ميلان فاز في 4 من آخر 5 مباريات، مقابل فوز واحد لأودينيزي.',
        side:'إنتر ميلان يحقق معدل 2.4 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +22 لإنتر ميلان، مقابل -5 لأودينيزي.' } },

    { teamA:'باريس سان جيرمان', teamB:'ستاد رين', venue:'home', league:'الدوري الفرنسي', country:'فرنسا', day: DAYS[(todayIndex+2)%7], time:'21:00', prob:83,
      analysis:{
        form:'باريس سان جيرمان فاز في 5 من آخر 5 مباريات، مقابل فوزين لستاد رين.',
        side:'باريس سان جيرمان يحقق معدل 2.7 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +30 لباريس سان جيرمان، مقابل صفر لستاد رين.' } },

    { teamA:'أرسنال', teamB:'برايتون', venue:'home', league:'الدوري الإنجليزي', country:'إنجلترا', day: DAYS[(todayIndex+2)%7], time:'18:00', prob:58,
      analysis:{
        form:'أرسنال فاز في مباراتين وتعادل في 2 من آخر 5 مباريات، مقابل فوزين لبرايتون.',
        side:'أرسنال يحقق معدل 2.0 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +12 لأرسنال، مقابل +3 لبرايتون.' } },

    { teamA:'الأهلي', teamB:'الزمالك', venue:'home', league:'الدوري المصري', country:'مصر', day: DAYS[(todayIndex+3)%7], time:'19:00', prob:55,
      analysis:{
        form:'الأهلي فاز في مباراتين وتعادل في 2 من آخر 5 مباريات، مقابل فوزين للزمالك.',
        side:'الأهلي يحقق معدل 1.9 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +9 للأهلي، مقابل +7 للزمالك.' } },

    { teamA:'أتلتيكو مدريد', teamB:'قادش', venue:'home', league:'الدوري الإسباني', country:'إسبانيا', day: DAYS[(todayIndex+3)%7], time:'20:30', prob:75,
      analysis:{
        form:'أتلتيكو مدريد فاز في 4 من آخر 5 مباريات، مقابل فوز واحد لقادش.',
        side:'أتلتيكو مدريد يحقق معدل 2.3 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +17 لأتلتيكو مدريد، مقابل -10 لقادش.' } },

    { teamA:'دورتموند', teamB:'لايبزيغ', venue:'home', league:'الدوري الألماني', country:'ألمانيا', day: DAYS[(todayIndex+4)%7], time:'19:30', prob:52,
      analysis:{
        form:'دورتموند فاز في مباراتين وتعادل في 2 من آخر 5 مباريات، مقابل 3 انتصارات للايبزيغ.',
        side:'دورتموند يحقق معدل 1.8 نقطة/مباراة كمضيف هذا الموسم.',
        goals:'فارق الأهداف هذا الموسم: +8 لدورتموند، مقابل +11 للايبزيغ.' } }
  ];

  SAMPLE_MATCHES.forEach(function(m, i){ m.id = i; });

  var MATCHES = SAMPLE_MATCHES;

  // ---------- State ----------
  var state = { tab:'today', day: todayName };

  // ---------- Helpers ----------
  function probTier(p){
    if(p >= 80) return 'high';
    if(p >= 70) return 'mid';
    return 'low';
  }
  function badgeClass(p){
    var t = probTier(p);
    return t === 'high' ? 'badge-high' : (t === 'mid' ? 'badge-mid' : 'badge-low');
  }
  function fillClass(p){
    var t = probTier(p);
    return t === 'high' ? 'fill-high' : (t === 'mid' ? 'fill-mid' : 'fill-low');
  }

  function getVisibleMatches(){
    var list;
    if(state.tab === 'today'){
      list = MATCHES.filter(function(m){ return m.day === todayName; });
    } else {
      list = MATCHES.filter(function(m){ return m.day === state.day; });
    }
    return list.slice().sort(function(a,b){ return b.prob - a.prob; });
  }

  // ---------- Render: day chips ----------
  function renderDayChips(){
    var container = document.querySelector('#dayChips > div');
    container.innerHTML = '';
    DAYS.forEach(function(d){
      var btn = document.createElement('button');
      btn.className = 'day-chip glass rounded-full px-4 py-2 text-sm font-semibold border' + (d === state.day ? ' active' : '');
      btn.style.borderColor = d === state.day ? 'var(--green)' : 'transparent';
      btn.textContent = d + (d === todayName ? ' (اليوم)' : '');
      btn.addEventListener('click', function(){
        state.day = d;
        renderDayChips();
        renderMatches();
      });
      container.appendChild(btn);
    });
  }

  // ---------- Render: matches ----------
  function matchCardHTML(m){
    return (
      '<div class="match-card glass rounded-2xl p-4 sm:p-5" data-id="' + m.id + '">' +
        '<div class="flex items-start justify-between gap-3 mb-3">' +
          '<div>' +
            '<div class="text-white font-bold text-base sm:text-lg">' + m.teamA + ' <span class="text-gray-500 font-normal">ضد</span> ' + m.teamB + '</div>' +
            '<div class="text-xs sm:text-sm text-gray-400 mt-1">' + m.league + ' · ' + m.country + '</div>' +
          '</div>' +
          '<span class="text-xs sm:text-sm text-gray-400 whitespace-nowrap">' + m.day + ' · ' + m.time + '</span>' +
        '</div>' +
        '<div class="flex items-center gap-3">' +
          '<div class="meter-track flex-1"><div class="meter-fill ' + fillClass(m.prob) + '" data-target="' + m.prob + '"></div></div>' +
          '<span class="badge-' + probTier(m.prob) + ' text-xs font-bold px-2.5 py-1 rounded-full">' + m.prob + '%</span>' +
        '</div>' +
        '<div class="text-[11px] sm:text-xs text-gray-500 mt-2">فوز ' + m.teamA + ' متوقع (' + (m.venue === 'home' ? 'كمضيف' : 'كضيف') + ') · اضغط للتحليل</div>' +
      '</div>'
    );
  }

  function renderMatches(){
    var list = getVisibleMatches();
    var listEl = document.getElementById('matchesList');
    var emptyEl = document.getElementById('emptyState');
    var titleEl = document.getElementById('sectionTitle');
    var countEl = document.getElementById('matchCount');

    titleEl.textContent = state.tab === 'today' ? 'أفضل التوقعات لهذا اليوم' : 'توقعات يوم ' + state.day;
    countEl.textContent = list.length ? (list.length + ' مباراة') : '';

    if(list.length === 0){
      listEl.innerHTML = '';
      emptyEl.classList.remove('hidden');
      return;
    }
    emptyEl.classList.add('hidden');
    listEl.innerHTML = list.map(matchCardHTML).join('');

    // animate meters
    requestAnimationFrame(function(){
      document.querySelectorAll('.meter-fill').forEach(function(el){
        var target = el.getAttribute('data-target');
        setTimeout(function(){ el.style.width = target + '%'; }, 60);
      });
    });

    // bind clicks
    listEl.querySelectorAll('.match-card').forEach(function(card){
      card.addEventListener('click', function(){
        var id = parseInt(card.getAttribute('data-id'), 10);
        openModal(MATCHES[id]);
      });
    });
  }

  // ---------- Modal ----------
  var overlay = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');

  function openModal(m){
    content.innerHTML =
      '<div class="pl-8">' +
        '<div class="text-xs text-gray-400 mb-1">' + m.league + ' · ' + m.country + '</div>' +
        '<h3 class="text-white font-extrabold text-xl mb-1">' + m.teamA + ' <span class="text-gray-500 font-normal">ضد</span> ' + m.teamB + '</h3>' +
        '<div class="text-sm text-gray-400 mb-4">' + m.day + ' · ' + m.time + '</div>' +
        '<div class="flex items-center gap-3 mb-6">' +
          '<div class="meter-track flex-1"><div class="meter-fill ' + fillClass(m.prob) + '" style="width:' + m.prob + '%"></div></div>' +
          '<span class="badge-' + probTier(m.prob) + ' text-sm font-bold px-3 py-1 rounded-full">' + m.prob + '%</span>' +
        '</div>' +
        '<div class="space-y-4">' +
          '<div class="glass rounded-xl p-4">' +
            '<div class="text-emerald-400 text-xs font-bold mb-1">الفورمة الأخيرة</div>' +
            '<div class="text-gray-200 text-sm">' + m.analysis.form + '</div>' +
          '</div>' +
          '<div class="glass rounded-xl p-4">' +
            '<div class="text-emerald-400 text-xs font-bold mb-1">الأداء كمضيف / كضيف</div>' +
            '<div class="text-gray-200 text-sm">' + m.analysis.side + '</div>' +
          '</div>' +
          '<div class="glass rounded-xl p-4">' +
            '<div class="text-emerald-400 text-xs font-bold mb-1">فارق الأهداف هذا الموسم</div>' +
            '<div class="text-gray-200 text-sm">' + m.analysis.goals + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="text-[10px] text-gray-600 mt-5">النسبة محسوبة بنموذج داخلي من بيانات الفورمة والترتيب — وليست توقعًا من جهة مراهنات.</div>' +
      '</div>';
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    document.body.style.overflow = '';
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  // ---------- Tabs ----------
  var tabToday = document.getElementById('tabToday');
  var tabWeek = document.getElementById('tabWeek');
  var dayChips = document.getElementById('dayChips');

  tabToday.addEventListener('click', function(){
    state.tab = 'today';
    tabToday.classList.add('active');
    tabWeek.classList.remove('active');
    dayChips.classList.add('hidden');
    renderMatches();
  });

  tabWeek.addEventListener('click', function(){
    state.tab = 'week';
    tabWeek.classList.add('active');
    tabToday.classList.remove('active');
    dayChips.classList.remove('hidden');
    if(!state.day) state.day = todayName;
    renderDayChips();
    renderMatches();
  });

  // ---------- Share ----------
  document.getElementById('shareBtn').addEventListener('click', function(){
    var list = getVisibleMatches();
    var header = state.tab === 'today'
      ? '📊 توقعات Hamza Predictions لليوم (' + todayName + ')'
      : '📊 توقعات Hamza Predictions ليوم ' + state.day;

    var lines = [header, ''];
    if(list.length === 0){
      lines.push('لا توجد مباريات مسجّلة.');
    } else {
      list.forEach(function(m, idx){
        lines.push((idx+1) + '. ' + m.teamA + ' ضد ' + m.teamB + ' — ' + m.league);
        lines.push('   نسبة الفوز المتوقعة: ' + m.prob + '% لصالح ' + m.teamA + ' · ' + m.time);
      });
    }
    lines.push('');
    lines.push('عبر تطبيق Hamza Predictions');

    var text = encodeURIComponent(lines.join('\n'));
    window.open('https://wa.me/?text=' + text, '_blank');
  });

  // ---------- تحميل بيانات الوكيل الحيّة (إن وُجدت)، مع العودة للبيانات التجريبية عند التعذّر ----------
  function setSourceNote(text){
    document.getElementById('dataSourceNote').textContent = text;
  }

  function loadLiveDataThenRender(){
    fetch('data/matches.json', { cache: 'no-store' })
      .then(function(res){ if(!res.ok) throw new Error('no data file'); return res.json(); })
      .then(function(json){
        if(json && Array.isArray(json.matches) && json.matches.length){
          MATCHES = json.matches;
          MATCHES.forEach(function(m, i){ if(m.id === undefined) m.id = i; });
          if(json.generatedAt){
            var updated = new Date(json.generatedAt);
            var fmt = new Intl.DateTimeFormat('ar', { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short', timeZone:'Asia/Riyadh' });
            setSourceNote('بيانات مباشرة · آخر تحديث ' + fmt.format(updated));
          } else {
            setSourceNote('بيانات مباشرة من الوكيل التلقائي');
          }
        } else {
          throw new Error('empty data file');
        }
        renderMatches();
      })
      .catch(function(){
        MATCHES = SAMPLE_MATCHES;
        setSourceNote('تحليلات ذكية وتوقعات نسب الفوز (بيانات تجريبية للعرض)');
        renderMatches();
      });
  }

  // ---------- Init ----------
  loadLiveDataThenRender();

})();
</script>

</body>
</html>
